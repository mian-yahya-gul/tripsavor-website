name: D1 backup
# Disabled until you set the repository variable BACKUP_ENABLED=true and the secrets below.
on:
  schedule:
    - cron: "17 2 * * *"           # daily 02:17 UTC
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup:
    if: ${{ vars.BACKUP_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: scripts/backup-d1.sh backups
      - uses: actions/upload-artifact@v4
        with:
          name: d1-backup-encrypted
          path: backups/*.enc*
          retention-days: 30
